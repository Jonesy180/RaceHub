<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="Out The Garage!">
<defs>
 <filter id="rough"><feTurbulence baseFrequency=".032" numOctaves="3" seed="11" result="n"/>
 <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
</defs>
<!-- restrained paint splatter -->
<g fill="#f7f7f4" opacity=".92">
 <circle cx="90" cy="85" r="7"/><circle cx="125" cy="55" r="4"/><circle cx="180" cy="292" r="5"/>
