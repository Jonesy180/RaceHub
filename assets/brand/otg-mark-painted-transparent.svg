</g>
<g fill="#20dfff" opacity=".95">
 <circle cx="735" cy="65" r="8"/><circle cx="800" cy="120" r="4"/><circle cx="825" cy="255" r="6"/>
 <circle cx="680" cy="290" r="4"/>
</g>
<g filter="url(#rough)" transform="translate(55 20) skewX(-7)">
 <text x="40" y="205" fill="#f7f7f4" stroke="#030506" stroke-width="18" paint-order="stroke"
