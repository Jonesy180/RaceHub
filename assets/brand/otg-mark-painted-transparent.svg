<path d="M790 218v57h7v-57z"/></g>
<text x="450" y="326" text-anchor="middle" fill="#20dfff" font-family="Arial,Helvetica,sans-serif"
 font-size="31" font-weight="800" letter-spacing="7">OUT THE GARAGE!</text>
<text x="450" y="366" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif"
 font-size="18" font-weight="700" letter-spacing="6">DRIVE • RECORD • IMPROVE</text>
</svg>