<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Out The Garage!">
<defs>
 <filter id="rough" x="-10%" y="-15%" width="120%" height="140%">
  <feTurbulence baseFrequency=".018 .055" numOctaves="3" seed="17" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
 </filter>
</defs>

<!-- cyan/white overspray around one compact joined mark -->
<g opacity=".95">
 <g fill="#20dfff">
  <circle cx="94" cy="93" r="8"/><circle cx="121" cy="67" r="4"/><circle cx="148" cy="112" r="5"/>
  <circle cx="760" cy="72" r="7"/><circle cx="800" cy="100" r="4"/><circle cx="835" cy="165" r="6"/>
  <circle cx="745" cy="258" r="5"/><circle cx="160" cy="265" r="4"/>
 </g>
 <g fill="#f7f7f4">
  <circle cx="116" cy="145" r="5"/><circle cx="180" cy="62" r="4"/><circle cx="575" cy="61" r="4"/>
  <circle cx="635" cy="260" r="4"/>
 </g>
</g>

<!-- heavy black sprayed silhouette tying OTG! into one unit -->
<path d="M100 80 Q130 45 195 48 L730 48 Q790 50 820 92 L810 236 Q790 270 730 276
 L160 276 Q105 267 88 222 Z" fill="#020405" opacity=".96" filter="url(#rough)"/>

<!-- joined aggressive master lettering -->
<g filter="url(#rough)" transform="translate(82 34) skewX(-8)">
 <text x="38" y="206" fill="#f7f7f4" stroke="#020405" stroke-width="10" paint-order="stroke"
  font-family="Arial Black,Arial,sans-serif" font-size="205" font-weight="900" letter-spacing="-20">OTG</text>
 <text x="620" y="206" fill="#20dfff" stroke="#020405" stroke-width="10" paint-order="stroke"
  font-family="Arial Black,Arial,sans-serif" font-size="205" font-weight="900">!</text>
</g>

<!-- convincing paint drips -->
<g fill="#f7f7f4">
 <path d="M178 226h10v65h-10z"/><circle cx="183" cy="294" r="5"/>
 <path d="M335 230h8v88h-8z"/><circle cx="339" cy="321" r="4"/>
 <path d="M565 228h8v48h-8z"/>
</g>
<g fill="#20dfff">
 <path d="M747 221h10v99h-10z"/><circle cx="752" cy="324" r="5"/>
 <path d="M785 219h7v58h-7z"/>
</g>

<!-- full identity under the mark -->
<text x="460" y="325" text-anchor="middle" fill="#20dfff"
 font-family="Arial Black,Arial,sans-serif" font-size="31" font-weight="900" letter-spacing="5">OUT THE GARAGE!</text>
<path d="M300 341 Q460 352 620 341" fill="none" stroke="#20dfff" stroke-width="6" stroke-linecap="round"/>
<text x="460" y="377" text-anchor="middle" fill="#ffffff"
 font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="6">DRIVE • RECORD • IMPROVE</text>
</svg>